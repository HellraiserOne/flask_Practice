name: CI/CD Pipeline - Flask MongoDB App

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1                     # change to your ECR/EC2 region
  ECR_REPOSITORY: flask-practice               # must match the repo name you created in ECR
  APP_PORT: 5000

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: pytest -v

  build-and-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.test.outputs.short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ needs.build-and-push.outputs.ecr_registry }}
            docker pull ${{ needs.build-and-push.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}
            docker stop flask-practice-app || true
            docker rm flask-practice-app || true
            docker run -d --name flask-practice-app \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              ${{ needs.build-and-push.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Verify health endpoint
        id: verify
        run: |
          sleep 8
          for i in 1 2 3 4 5; do
            if curl -sf http://${{ secrets.EC2_HOST }}:${{ env.APP_PORT }}/health; then
              echo "status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 5
          done
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1

  notify-success:
    name: Notify Success
    needs: [test, build-and-push, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "SUCCESS - flask_Practice deploy (${{ needs.build-and-push.outputs.image_tag }})"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Pipeline
          body: |
            Deployment succeeded.

            Commit SHA: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Docker image tag: ${{ needs.build-and-push.outputs.image_tag }}
            ECR repository: ${{ needs.build-and-push.outputs.ecr_registry }}/flask-practice
            EC2 target: ${{ secrets.EC2_HOST }}
            Pipeline run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-failure:
    name: Notify Failure
    needs: [test, build-and-push, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Determine failed stage
        id: stage
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "failed_stage=Test" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.build-and-push.result }}" == "failure" ]; then
            echo "failed_stage=Build/Push to ECR" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "failed_stage=Deploy to EC2 / Health Check" >> "$GITHUB_OUTPUT"
          else
            echo "failed_stage=Unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "FAILED - flask_Practice pipeline (stage: ${{ steps.stage.outputs.failed_stage }})"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Pipeline
          body: |
            Pipeline failed.

            Failed stage: ${{ steps.stage.outputs.failed_stage }}
            Commit SHA: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Pipeline run/logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the logs above for details.